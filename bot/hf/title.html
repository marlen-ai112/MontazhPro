<!doctype html>
<html lang="ru" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="./gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; font-family: "DejaVu Sans", "Liberation Sans", Arial, sans-serif; }
      #card {
        position: absolute; left: 70px; right: 70px; top: 300px;
        padding: 46px 50px 54px; border-radius: 36px;
        background: rgba(8, 10, 18, 0.46); border: 3px solid rgba(255, 255, 255, 0.16);
      }
      #words { display: flex; flex-wrap: wrap; gap: 6px 24px; justify-content: center; }
      .w {
        display: inline-block; color: #fff; font-weight: 800; font-size: 104px; line-height: 1.12; letter-spacing: -1px;
        text-transform: uppercase; text-shadow: 0 6px 0 rgba(0, 0, 0, 0.55), 0 0 28px rgba(0, 0, 0, 0.5);
      }
      .w.hot { color: __ACCENT__; }
      #bar { height: 14px; width: 0; margin: 30px auto 0; border-radius: 7px; background: __ACCENT__; box-shadow: 0 0 24px __ACCENT__; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.4" data-width="1080" data-height="1920">
      <div id="card" class="clip" data-start="0" data-duration="3.4" data-track-index="0">
        <div id="words">__WORDS__</div>
        <div id="bar"></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#card", { opacity: 0, y: 90, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 0);
      tl.fromTo(".w", { opacity: 0, y: 70, rotate: -5, scale: 0.7 }, { opacity: 1, y: 0, rotate: 0, scale: 1, duration: 0.5, ease: "back.out(2)", stagger: 0.09 }, 0.2);
      tl.to("#bar", { width: "78%", duration: 0.7, ease: "power3.out" }, 0.55);
      tl.to("#card", { opacity: 0, y: -80, duration: 0.45, ease: "power2.in" }, 2.85);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
